name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check phishguard tests
      - run: python -m pytest -q
      - run: phishguard train --csv examples/demo_emails.csv --output artifacts
      - run: |
          phishguard analyze --model artifacts/phishing_model.joblib --text 'Urgent: verify your password now'

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[ui]'
      - run: phishguard train --csv examples/demo_emails.csv --output artifacts
      - run: |
          phishguard serve --model artifacts/phishing_model.joblib --port 7861 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /tmp/phishguard.html http://127.0.0.1:7861/; then
              exit 0
            fi
            sleep 1
          done
          exit 1
