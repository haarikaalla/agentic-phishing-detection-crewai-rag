[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-evidence"
version = "0.1.0"
description = "Evidence-first phishing email analysis with an offline reproducible classifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
data = ["datasets>=3,<5"]
ui = ["gradio>=5,<7"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.packages.find]
include = ["phishguard*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
